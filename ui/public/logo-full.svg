<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <linearGradient id="orangeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff6b1a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="2" width="60" height="60" rx="14" fill="url(#bgGrad2)"/>

  <!-- Calendar top bar -->
  <rect x="10" y="16" width="40" height="11" rx="4" fill="url(#orangeGrad2)"/>
  <rect x="10" y="23" width="40" height="4" rx="0" fill="url(#orangeGrad2)"/>
  <rect x="10" y="27" width="40" height="28" rx="0" rx="4" fill="#1e2436" stroke="#2e3550" stroke-width="1"/>
  <rect x="10" y="16" width="40" height="15" rx="4" fill="url(#orangeGrad2)"/>

  <!-- Calendar hooks -->
  <rect x="20" y="10" width="5" height="13" rx="2.5" fill="#ff934f"/>
  <rect x="35" y="10" width="5" height="13" rx="2.5" fill="#ff934f"/>

  <!-- Grid dots -->
  <rect x="14" y="36" width="6" height="6" rx="1.5" fill="#2e3550"/>
  <rect x="24" y="36" width="6" height="6" rx="1.5" fill="#2e3550"/>
  <rect x="34" y="36" width="6" height="6" rx="1.5" fill="#ff934f" filter="url(#glow2)"/>
  <rect x="44" y="36" width="6" height="6" rx="1.5" fill="#2e3550"/>
  <rect x="14" y="46" width="6" height="6" rx="1.5" fill="#2e3550"/>
  <rect x="24" y="46" width="6" height="6" rx="1.5" fill="#2e3550"/>
  <rect x="34" y="46" width="6" height="6" rx="1.5" fill="#2e3550"/>
  <rect x="44" y="46" width="6" height="6" rx="1.5" fill="#2e3550"/>

  <!-- Lightning bolt -->
  <path d="M33 18 L28 27 L32 27 L27 35 L37 25 L33 25 Z" fill="white" opacity="0.95"/>

  <!-- Text: Smart -->
  <text x="76" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1f2e" letter-spacing="-0.5">Smart</text>
  <!-- Text: Event -->
  <text x="136" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ff934f" letter-spacing="-0.5">Event</text>

  <!-- Tagline -->
  <text x="77" y="47" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#9ca3af" letter-spacing="0.5">Organisez. Simplifiez. Réussissez.</text>
</svg>
